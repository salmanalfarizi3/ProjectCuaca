<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian Cuaca Destinasi - SaaS App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass-input {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-sky-900 to-indigo-950 text-white min-h-screen pb-12 p-4 selection:bg-sky-500 selection:text-white">

  <div class="max-w-md mx-auto pt-8 space-y-6">
    
    
    <div class="flex justify-between items-center">
      <a href="index.html" class="text-xs text-sky-300 hover:underline">← Beranda Utama</a>
      <a href="auth.html" class="text-xs text-sky-300 hover:underline">Portal Partner (API Key) →</a>
    </div>

    
    <div class="glass-card rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-sky-300">Cek Cuaca Destinasi</h2>
        <span id="authStatus" class="text-[10px] bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full font-mono">Memeriksa API Key...</span>
      </div>
      
      <div>
        <label class="text-xs text-slate-200 block mb-1.5 font-medium">Nama Kota / Destinasi Wisata:</label>
        <div class="flex gap-2">
          <input type="text" id="cityInput" placeholder="Contoh: Yogyakarta, Jakarta..." class="glass-input flex-1 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-400">
          <button onclick="fetchWeatherData()" class="bg-sky-500 hover:bg-sky-400 text-white font-semibold px-5 py-3 rounded-xl transition text-sm shadow-lg shadow-sky-500/25">
            Cari
          </button>
        </div>
      </div>
    </div>

    
    <div class="glass-card rounded-3xl p-6 text-center space-y-3 shadow-xl">
      <div class="inline-block px-3 py-1 rounded-full bg-sky-500/10 text-xs font-medium text-sky-300 border border-sky-400/20">
        🗺️ Destinasi Wisata Terpilih
      </div>
      
      
      <div id="tourStatusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
        <span>🟢</span> Status Tour: Aman / Kondusif
      </div>

      <h1 id="heroCity" class="text-3xl font-bold tracking-tight">Yogyakarta</h1>
      <div id="heroTemp" class="text-7xl font-extralight tracking-tighter my-2 text-sky-200">28°C</div>
      <p id="heroCondition" class="text-xs text-slate-300 font-medium">Cerah & Nyaman untuk Wisata Outdoor</p>
    </div>

    
    <div class="grid grid-cols-2 gap-3">
      <div class="glass-card rounded-2xl p-4 space-y-1">
        <span class="text-[10px] text-slate-400 font-semibold tracking-wider">💧 KELEMBABAN</span>
        <p id="humidityVal" class="text-xl font-bold">75%</p>
        <p class="text-[10px] text-slate-400">Nyaman untuk jalan-jalan.</p>
      </div>
      <div class="glass-card rounded-2xl p-4 space-y-1">
        <span class="text-[10px] text-slate-400 font-semibold tracking-wider">💨 ANGIN</span>
        <p id="windVal" class="text-xl font-bold">12 km/h</p>
        <p class="text-[10px] text-slate-400">Sejuk, angin sepoi-sepoi.</p>
      </div>
    </div>

  </div>

  <script>
    window.onload = function() {
      const savedApiKey = localStorage.getItem('saas_api_key');
      const statusBadge = document.getElementById('authStatus');
      
      if (savedApiKey) {
        statusBadge.innerText = "API Key Aktif (Authorized)";
        statusBadge.className = "text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full font-mono";
      } else {
        statusBadge.innerText = "Belum Ada API Key";
        statusBadge.className = "text-[10px] bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded-full font-mono";
      }
    };

    async function fetchWeatherData() {
      const savedApiKey = localStorage.getItem('saas_api_key');
      const cityName = document.getElementById('cityInput').value.trim();

      if (!savedApiKey) {
        alert("Akses Ditolak (401): Anda belum memiliki API Key! Silakan daftar atau login terlebih dahulu di Portal Partner.");
        window.location.href = "auth.html";
        return;
      }

      if (!cityName) {
        alert("Silakan masukkan nama kota destinasi wisata!");
        return;
      }

      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=id&format=json`;
        const geoResponse = await fetch(geoUrl);
        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
          alert(`Destinasi "${cityName}" tidak ditemukan.`);
          return;
        }

        const location = geoData.results[0];
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`;
        const weatherResponse = await fetch(weatherUrl);
        const weatherData = await weatherResponse.json();
        const current = weatherData.current;

        
        document.getElementById('heroCity').innerText = `${location.name}, ${location.country || ''}`;
        document.getElementById('heroTemp').innerText = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('humidityVal').innerText = `${current.relative_humidity_2m}%`;
        document.getElementById('windVal').innerText = `${current.wind_speed_10m} km/h`;

        
        const windSpeed = current.wind_speed_10m;
        const tourBadge = document.getElementById('tourStatusBadge');

        if (windSpeed > 30) {
          tourBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30";
          tourBadge.innerHTML = "<span>🔴</span> Status Tour: Berbahaya / Angin Kencang";
          document.getElementById('heroCondition').innerText = "Peringatan: Angin kencang, tidak disarankan untuk aktivitas outdoor.";
        } else if (windSpeed > 20) {
          tourBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30";
          tourBadge.innerHTML = "<span>🟡</span> Status Tour: Waspada / Cukup Berangin";
          document.getElementById('heroCondition').innerText = "Kondisi cukup berangin, harap berhati-hati untuk wisata luar ruangan.";
        } else {
          tourBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
          tourBadge.innerHTML = "<span>🟢</span> Status Tour: Aman / Sangat Kondusif";
          document.getElementById('heroCondition').innerText = "Cuaca bersahabat, sangat aman untuk jadwal tour.";
        }

      } catch (error) {
        console.error(error);
        alert("Gagal terhubung ke server.");
      }
    }
  </script>
</body>
</html>
