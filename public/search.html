<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian Cuaca Destinasi - TripMeteo SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .ios-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .ios-input {
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .ios-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body class="bg-gradient-to-b from-[#38bdf8] via-[#0284c7] to-[#1e3a8a] text-white min-h-screen pb-12 p-4 selection:bg-white selection:text-sky-600">

  <div class="max-w-md mx-auto pt-6 space-y-5">
    
    <!-- Navigasi Atas -->
    <div class="flex justify-between items-center px-2">
      <a href="index.html" class="text-xs font-semibold text-white/80 hover:text-white transition">← Beranda Utama</a>
      <a href="auth.html" class="text-xs font-semibold text-white/80 hover:text-white transition">Portal Partner (API Key) →</a>
    </div>

    <!-- Kotak Pencarian -->
    <div class="ios-card rounded-2xl p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-white/20 pb-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-white">Cek Cuaca Destinasi</h2>
        <span id="authStatus" class="text-[10px] bg-white/20 text-white px-2.5 py-1 rounded-full font-mono font-semibold">Memeriksa API Key...</span>
      </div>
      
      <div>
        <label class="text-xs text-white/90 block mb-1.5 font-medium">Nama Kota / Destinasi Wisata:</label>
        <div class="flex gap-2">
          <input type="text" id="cityInput" placeholder="Contoh: Yogyakarta, Purworejo..." class="ios-input flex-1 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-white">
          <button onclick="fetchWeatherData()" class="bg-white hover:bg-sky-50 text-sky-700 font-semibold px-5 py-3 rounded-xl transition text-sm shadow-md">
            Cari
          </button>
        </div>
      </div>
    </div>

    <!-- Kartu Hasil Utama -->
    <div class="ios-card rounded-2xl p-6 text-center space-y-3">
      <div class="inline-block px-3 py-1 rounded-full bg-white/20 text-xs font-semibold text-white border border-white/30">
        🗺️ Destinasi Wisata Terpilih
      </div>
      
      <div id="tourStatusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/30 text-emerald-100 border border-emerald-400/40">
        <span>🟢</span> Status Tour: Aman / Kondusif
      </div>

      <h1 id="heroCity" class="text-3xl font-bold tracking-tight text-white">Yogyakarta</h1>
      <div id="heroTemp" class="text-7xl font-extralight tracking-tighter my-2 text-white">28°C</div>
      <p id="heroCondition" class="text-xs text-white/90 font-medium">Kondisi: Memuat data...</p>
    </div>

    <!-- Grid Informasi Tambahan -->
    <div class="grid grid-cols-2 gap-3">
      <div class="ios-card rounded-2xl p-4 space-y-1">
        <span class="text-[10px] text-white/75 font-bold tracking-wider">💧 KELEMBABAN</span>
        <p id="humidityVal" class="text-xl font-bold text-white">-</p>
        <p class="text-[10px] text-white/70">Kelembaban udara.</p>
      </div>
      <div class="ios-card rounded-2xl p-4 space-y-1">
        <span class="text-[10px] text-white/75 font-bold tracking-wider">💨 ANGIN & AQI</span>
        <p id="windVal" class="text-xl font-bold text-white">-</p>
        <p id="aqiText" class="text-[10px] text-white/70">AQI: -</p>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://url-project-supabase-kamu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6...'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = function() {
      const savedApiKey = localStorage.getItem('saas_api_key');
      const statusBadge = document.getElementById('authStatus');
      
      if (savedApiKey) {
        statusBadge.innerText = "API Key Aktif";
        statusBadge.className = "text-[10px] bg-emerald-500/30 text-emerald-100 px-2.5 py-1 rounded-full font-mono font-semibold";
      } else {
        statusBadge.innerText = "Belum Ada API Key";
        statusBadge.className = "text-[10px] bg-rose-500/30 text-rose-100 px-2.5 py-1 rounded-full font-mono font-semibold";
      }
    };

    async function fetchWeatherData() {
      const savedApiKey = localStorage.getItem('saas_api_key');
      const cityName = document.getElementById('cityInput').value.trim();

      if (!savedApiKey) {
        alert("Akses Ditolak (401): Anda belum memiliki API Key! Silakan daftar atau login terlebih dahulu di Portal Partner.");
        window.location.href = "auth.html";
        return;
      }

      if (!cityName) {
        alert("Silakan masukkan nama kota destinasi wisata!");
        return;
      }

      try {
        let { data: dbData, error: dbError } = await supabaseClient
          .from('nama_tabel_kamu') 
          .select('*')
          .ilike('city', `%${cityName}%`)
          .limit(1);

        if (!dbError && dbData && dbData.length > 0) {
          const item = dbData[0];
          
          document.getElementById('heroCity').innerText = `${item.city}, ${item.country || 'ID'}`;
          document.getElementById('heroTemp').innerText = `${item.temperature}°C`;
          document.getElementById('humidityVal').innerText = `${item.humidity}%`;
          document.getElementById('windVal').innerText = `${item.windSpeed} km/h`;
          document.getElementById('heroCondition').innerText = `Kondisi: ${item.weatherCondition}`;
          document.getElementById('aqiText').innerText = `AQI: ${item.airQualityIndex}`;

          updateTourStatus(item.windSpeed);
          return; 
        }

        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=id&format=json`;
        const geoResponse = await fetch(geoUrl);
        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
          alert(`Destinasi "${cityName}" tidak ditemukan.`);
          return;
        }

        const location = geoData.results[0];
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`;
        const weatherResponse = await fetch(weatherUrl);
        const weatherData = await weatherResponse.json();
        const current = weatherData.current;

        document.getElementById('heroCity').innerText = `${location.name}, ${location.country || ''}`;
        document.getElementById('heroTemp').innerText = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('humidityVal').innerText = `${current.relative_humidity_2m}%`;
        document.getElementById('windVal').innerText = `${current.wind_speed_10m} km/h`;
        document.getElementById('heroCondition').innerText = "Kondisi: Cerah";
        document.getElementById('aqiText').innerText = "AQI: N/A";

        updateTourStatus(current.wind_speed_10m);

      } catch (error) {
        console.error(error);
        alert("Gagal terhubung ke database.");
      }
    }

    function updateTourStatus(windSpeed) {
      const tourBadge = document.getElementById('tourStatusBadge');
      if (windSpeed > 30) {
        tourBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/30 text-rose-100 border border-rose-400/40";
        tourBadge.innerHTML = "<span>🔴</span> Status Tour: Berbahaya / Angin Kencang";
      } else if (windSpeed > 20) {
        tourBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/30 text-amber-100 border border-amber-400/40";
        tourBadge.innerHTML = "<span>🟡</span> Status Tour: Waspada / Cukup Berangin";
      } else {
        tourBadge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/30 text-emerald-100 border border-emerald-400/40";
        tourBadge.innerHTML = "<span>🟢</span> Status Tour: Aman / Sangat Kondusif";
      }
    }
  </script>
</body>
</html>
